<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    Вариант A — «БРЕНДОВАЯ ПИЛЮЛЯ»
    Плотная заливка брендовым acid pink #FF1A8C, белый текст в одну строку, мягкая тёмная тень
    под всей плашкой. Максимальная узнаваемость бренда; читается на любом кадре, потому что
    подложка непрозрачная. Требование Криника (интервью 012, В2): низ-центр + брендовое + тень.
    [NOT-TESTED] — мокап для согласования, кодом ещё не реализован.
  -->
  <defs>
    <filter id="shadowA" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="7" stdDeviation="14" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- Пилюля: низ-центр, отступ снизу 72px. Ширина 1000 подобрана так, чтобы двуязычная строка
       умещалась целиком с правым полем (первый заход с w=888 обрезал «Reconnecting»). -->
  <g filter="url(#shadowA)">
    <rect x="460" y="912" width="1000" height="96" rx="48" ry="48" fill="#FF1A8C"/>
  </g>

  <!-- Индикатор: белая точка с «волной» (в живой плашке пульсирует альфой) -->
  <circle cx="524" cy="960" r="19" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="524" cy="960" r="11" fill="#FFFFFF"/>

  <!-- Текст в одну строку, двуязычно -->
  <text x="566" y="974" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">
    Связь восстанавливается · Reconnecting
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    Вариант D — «МИНИМАЛ, БЕЗ ПЛАШКИ»
    Плашки нет вовсе: текст с толстым чёрным КОНТУРОМ поверх белой заливки — приём, уже проверенный
    в StandbyImage.renderBody (там Криник забраковал мягкую тень и обводка победила: она читается
    поверх любого кадра). Максимально бережёт картинку зрителя, бренд — только в цвете индикатора.
    Риск: без подложки выглядит менее «продуктово», чем A/B/C.
    [NOT-TESTED] — мокап для согласования.
  -->

  <!-- Брендовый индикатор с «волной» -->
  <circle cx="652" cy="948" r="22" fill="#FF1A8C" opacity="0.30"/>
  <circle cx="652" cy="948" r="12" fill="#FF1A8C"/>

  <!-- Основная строка: сначала толстый чёрный контур, поверх — белая заливка -->
  <text x="694" y="962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" fill="none"
        stroke="#000000" stroke-width="9" stroke-linejoin="round" opacity="0.85">
    Связь восстанавливается
  </text>
  <text x="694" y="962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" fill="#FFFFFF">
    Связь восстанавливается
  </text>

  <!-- Вторая строка, тем же приёмом -->
  <text x="694" y="1010" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="600" fill="none"
        stroke="#000000" stroke-width="7" stroke-linejoin="round" opacity="0.85">
    Reconnecting…
  </text>
  <text x="694" y="1010" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="600" fill="#FFFFFF" fill-opacity="0.88">
    Reconnecting…
  </text>
</svg>

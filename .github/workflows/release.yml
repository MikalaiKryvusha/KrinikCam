# Release workflow — MANUAL run only (workflow_dispatch). It builds a release APK and creates a GitHub Release,
# and it refuses to run unless the repository secrets KCAM_RELEASE_STORE_B64 (the keystore, base64) and
# KCAM_RELEASE_STORE_PASSWORD / KCAM_RELEASE_KEY_ALIAS / KCAM_RELEASE_KEY_PASSWORD are set — never a debug-signed release.
# Normal path: build and publish locally with the project's own key (.env KCAM_RELEASE_*), as for v0.9.1.
# Output: GitHub Release with APK attached at
#   github.com/MikalaiKryvusha/KrinikCam/releases

name: Release

# 2026-11-07 (KAST plans/17): no longer runs on a tag push. The runner has no release key, so the APK it attached to v0.9
# was signed with its throwaway debug key (CN=Android Debug) - every such build is a different signature and breaks updates
# through Obtainium. Releases are built and published locally with the project's own key (.env KCAM_RELEASE_*);
# this workflow stays as a manual run only.
on:
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create GitHub Releases

    steps:
      # Guard (KAST plans/17, 2026-11-07): without the release key the APK would be signed by the runner's debug key.
      - name: Refuse without the release key
        env:
          STORE_B64: ${{ secrets.KCAM_RELEASE_STORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KCAM_RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$STORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "No KCAM_RELEASE_* secrets: refusing to publish a debug-signed release. Publish locally with the own key."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for release notes generation

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The release key from the secrets; app/build.gradle.kts reads KCAM_RELEASE_* from the environment (envKey).
      - name: Restore the release key
        env:
          STORE_B64: ${{ secrets.KCAM_RELEASE_STORE_B64 }}
        run: |
          mkdir -p keystores
          echo "$STORE_B64" | base64 -d > keystores/kcam-release.jks

      - name: Build Release APK
        env:
          KCAM_RELEASE_STORE_FILE: keystores/kcam-release.jks
          KCAM_RELEASE_STORE_PASSWORD: ${{ secrets.KCAM_RELEASE_STORE_PASSWORD }}
          KCAM_RELEASE_KEY_ALIAS: ${{ secrets.KCAM_RELEASE_KEY_ALIAS }}
          KCAM_RELEASE_KEY_PASSWORD: ${{ secrets.KCAM_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Rename APK to include version tag for clarity in the release
      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk "KrinikCam-${VERSION}.apk"

      # Create GitHub Release with the APK attached and auto-generated notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "KrinikCam-${{ github.ref_name }}.apk"
          generate_release_notes: true
          name: "KrinikCam ${{ github.ref_name }}"
